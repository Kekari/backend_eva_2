<div class="container mantenimiento">
  <h3>{{ titulo }}</h3>
  <form method="post" class="formulario-mantenimiento">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="row g-3">
      {% for campo in form %}
        <div class="{% if campo.name == 'descripcion' %}col-12{% else %}col-md-6{% endif %}">
          <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}:</label>
          {{ campo }}
          {% for error in campo.errors %}<p class="text-danger mt-1" role="alert">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
    </div>
    <div class="acciones-formulario">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a class="btn btn-secondary" href="{% url volver %}">Cancelar</a>
    </div>
  </form>
</div>
